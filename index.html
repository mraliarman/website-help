        <div class="bg-orb three"></div>
        <div class="mouse-glow" id="mouseGlow"></div>
        <div class="grid-overlay"></div>
        <div class="page">
            <header class="hero">
                <div class="hero-badge">واژه‌نامه تخصصی طراحی و توسعه وب</div>
                <h1>اصطلاحات طراحی وب</h1>
                <p>مرجعی جذاب برای مرور مفاهیم مهم طراحی و توسعه وب</p>
            </header>
            <section class="search-panel">
                <div class="search-box">
                    <span class="search-icon">⌕</span
                    ><input
                        id="searchInput"
                        type="text"
                        placeholder="جستجو در عنوان یا توضیحات..."
                        autocomplete="off"
                    />
                </div>
                <div class="search-meta">
                    <span id="stats">در حال بارگذاری...</span
                    ><button class="clear-btn" id="clearBtn" type="button">پاک کردن جستجو</button>
                </div>
            </section>
            <section class="grid" id="termsContainer"></section>
            <div class="empty-state" id="emptyState"><span class="emoji">🔍</span>موردی با این عبارت پیدا نشد.</div>
        </div>
        <script>
            const termsContainer = document.getElementById("termsContainer");
            const searchInput = document.getElementById("searchInput"),
                emptyState = document.getElementById("emptyState"),
                stats = document.getElementById("stats"),
                clearBtn = document.getElementById("clearBtn"),
                mouseGlow = document.getElementById("mouseGlow");
            function getIcon(t) {
                return (
                    {
                        globe: "🌐",
                        server: "🖥️",
                        code: "💻",
                        layout: "🧩",
                        monitor: "🖼️",
                        search: "🔎",
                        lock: "🔐",
                        link: "🔗",
                        database: "🗄️",
                        cpu: "⚙️",
                        image: "🖼️",
                        file: "📄",
                        tool: "🛠️",
                        cloud: "☁️",
                        shield: "🛡️",
                        layers: "📚",
                        settings: "⚡",
                        smartphone: "📱",
                    }[t] || "✨"
                );
            }
            function createCard(t, e) {
                return `\n\t\t\t\t\t<article class="card reveal" style="animation-delay:${0.05 * e}s">\n\t\t\t\t\t\t<div class="card-content">\n\t\t\t\t\t\t\t<div class="card-top">\n\t\t\t\t\t\t\t\t<div class="icon-wrap">${getIcon(t.icon)}</div>\n\t\t\t\t\t\t\t\t<h2>${t.title}</h2>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t\t<p>${t.desc}</p>\n\t\t\t\t\t\t\t<div class="card-footer">\n\t\t\t\t\t\t\t\t<span class="tag">مفهوم کاربردی</span>\n\t\t\t\t\t\t\t\t<a href="${t.link}" target="_blank" rel="noopener noreferrer">\n\t\t\t\t\t\t\t\t\tمشاهده بیشتر\n\t\t\t\t\t\t\t\t\t<span>↗</span>\n\t\t\t\t\t\t\t\t</a>\n\t\t\t\t\t\t\t</div>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t</article>\n\t\t\t\t`;
            }
            function renderTerms(t) {
                (termsContainer.innerHTML = t.map((t, e) => createCard(t, e)).join("")),
                    (stats.innerHTML = `تعداد نتایج: <strong>${t.length}</strong> از <strong>${termsArray.length}</strong>`),
                    emptyState.classList.toggle("show", 0 === t.length),
                    attachCardTilt();
            }
            function filterTerms(t) {
                const e = t.trim().toLowerCase();
                if (!e) return void renderTerms(termsArray);
                renderTerms(
                    termsArray.filter((t) => t.title.toLowerCase().includes(e) || t.desc.toLowerCase().includes(e))
                );
            }
            function attachCardTilt() {
                document.querySelectorAll(".card").forEach((t) => {
                    t.addEventListener("mousemove", (e) => {
                        const n = t.getBoundingClientRect(),
                            r = e.clientX - n.left,
                            s = e.clientY - n.top,
                            o = n.width / 2,
                            a = n.height / 2,
                            l = ((s - a) / a) * -4,
                            c = ((r - o) / o) * 4;
                        t.style.transform = `translateY(-10px) rotateX(${l}deg) rotateY(${c}deg)`;
                    }),
                        t.addEventListener("mouseleave", () => {
                            t.style.transform = "";
                        });
                });
            }
            searchInput.addEventListener("input", function () {
                filterTerms(this.value);
            }),
                clearBtn.addEventListener("click", function () {
                    (searchInput.value = ""), searchInput.focus(), renderTerms(termsArray);
                }),
                document.addEventListener("mousemove", function (t) {
                    const e = (t.clientX / window.innerWidth) * 100,
                        n = (t.clientY / window.innerHeight) * 100;
                    document.documentElement.style.setProperty("--mouse-x", `${e}%`),
                        document.documentElement.style.setProperty("--mouse-y", `${n}%`),
                        (mouseGlow.style.left = `${t.clientX}px`),
                        (mouseGlow.style.top = `${t.clientY}px`);
                });
            let sparkleTimer = 0;
            document.addEventListener("mousemove", function (t) {
                const e = Date.now();
                if (e - sparkleTimer < 80) return;
                sparkleTimer = e;
                const n = document.createElement("span");
                (n.className = "sparkle"),
                    (n.style.left = `${t.clientX}px`),
                    (n.style.top = `${t.clientY}px`),
                    document.body.appendChild(n),
                    setTimeout(() => {
                        n.remove();
                    }, 800);
            });
            renderTerms(termsArray);
        </script>
    </body>
</html>

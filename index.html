<style>
:root{--bg:#070b16;--bg2:#0e1425;--bg3:#15102b;--surface:rgba(255,255,255,.07);--surface2:rgba(255,255,255,.11);--border:rgba(255,255,255,.12);--text:#f5f7ff;--muted:#b9c2df;--primary:#7b61ff;--secondary:#00d5ff;--accent:#ff4fd8;--gold:#ffcf70;--shadow:0 24px 80px rgba(0,0,0,.42);--mx:50%;--my:20%}

body{margin:0;min-height:100vh;color:var(--text);font-family:iranyekan,system-ui,sans-serif;background:radial-gradient(circle at var(--mx) var(--my),rgba(123,97,255,.16),transparent 20%),radial-gradient(circle at 12% 18%,rgba(255,79,216,.12),transparent 24%),radial-gradient(circle at 88% 80%,rgba(0,213,255,.1),transparent 25%),linear-gradient(135deg,var(--bg),var(--bg2) 48%,var(--bg3));background-attachment:fixed;overflow-x:hidden}

.page{position:relative;z-index:1;max-width:1380px;margin:auto;padding:34px 18px 70px}

h1{margin:18px 0 12px;font-size:clamp(34px,6vw,68px);line-height:1.2;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#fff,#d6dcff 38%,#94f0ff 70%,#ffd27d);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:820px;margin:auto;color:var(--muted);font-size:16px;line-height:2}
.search-panel{position:sticky;top:12px;z-index:10;max-width:1080px;margin:0 auto 24px;padding:13px;border:1px solid var(--border);border-radius:26px;background:rgba(9,12,24,.74);backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.search-box{position:relative}
.search-box input{width:100%;height:58px;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:rgba(255,255,255,.045);color:var(--text);padding:0 52px 0 16px;outline:0;font-size:15px;transition:border-color .2s,box-shadow .2s}
.search-box input:focus{border-color:rgba(123,97,255,.9);box-shadow:0 0 0 4px rgba(123,97,255,.14)}
.search-box input::placeholder{color:#9ea7c7}
.search-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:21px;pointer-events:none}
.clear-btn{height:58px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:linear-gradient(90deg,rgba(123,97,255,.24),rgba(0,213,255,.17));color:#fff;padding:0 17px;cursor:pointer;transition:transform .2s,filter .2s}
.clear-btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.category-nav{display:flex;gap:8px;overflow:auto;padding:10px 2px 2px;scrollbar-width:thin}
.category-btn{flex:0 0 auto;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.045);color:#cdd4ef;padding:9px 13px;cursor:pointer;font-size:12px;white-space:nowrap;transition:background .2s,border-color .2s,transform .2s}

.empty-state.show{display:block}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){.page{padding:20px 13px 42px}.hero{padding-top:18px}.search-panel{border-radius:21px}.search-row{grid-template-columns:1fr}.clear-btn{width:100%}.grid{grid-template-columns:1fr;gap:14px}.card{padding:19px;border-radius:21px}.card h2{font-size:17px}.card p{font-size:13.5px}.category-nav{padding-top:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}.card:hover{transform:none}}

<body>
<main class="page">
<header class="hero">
<div class="hero-badge">مرجع تخصصی طراحی، توسعه، سئو و وردپرس</div>
<h1>استانداردهای توسعه وب</h1>
<p>یک مرجع سریع و قابل جستجو برای SEO، بهینه‌سازی سرعت، توسعه قالب و افزونه وردپرس، Hooks، Actions، Filters، Template Hierarchy، UI/UX، امنیت و استانداردهای وب.</p>
</header>
<section class="search-panel" aria-label="جستجو و فیلتر استانداردها">
<div class="search-row">
<div class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><label class="sr-only" for="searchInput">جستجو</label><input id="searchInput" type="search" placeholder="جستجو در عنوان، توضیحات و دسته‌بندی..." autocomplete="off" enterkeyhint="search"></div>
<button class="clear-btn" id="clearBtn" type="button">پاک کردن</button>
</div>
<nav class="category-nav" id="categoryNav" aria-label="دسته‌بندی استانداردها"></nav>
<div class="search-meta"><span id="stats">در حال بارگذاری...</span><span id="status" aria-live="polite"></span></div>
</section>
<section class="grid" id="termsContainer" aria-live="polite"></section>
<div class="load-more" id="loadMoreWrap"><button id="loadMore" type="button">نمایش موارد بیشتر</button></div>
<div class="empty-state" id="emptyState"><span class="emoji">🔍</span>موردی با این عبارت پیدا نشد.</div>
</main>
<script src="/term.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded',()=>{
const container=document.getElementById('termsContainer');
const search=document.getElementById('searchInput');
const clear=document.getElementById('clearBtn');
const stats=document.getElementById('stats');
const status=document.getElementById('status');
const empty=document.getElementById('emptyState');
const loadMore=document.getElementById('loadMore');
const loadMoreWrap=document.getElementById('loadMoreWrap');
const nav=document.getElementById('categoryNav');
const pageSize=36;
let activeCategory='all';
let query='';
let visibleCount=pageSize;
let filtered=[];
let searchTimer=0;
let raf=0;
const icons={globe:'🌐',server:'🖥️',code:'💻',layout:'🧩',monitor:'🖼️',search:'🔎',lock:'🔐',link:'🔗',database:'🗄️',cloud:'☁️',shield:'🛡️',layers:'📚',settings:'⚡',smartphone:'📱',trending-up:'📈',zap:'⚡',package:'📦',repeat:'↻',filter:'◈',file:'📄',shopping-cart:'🛒'};
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
const buildNav=()=>{nav.innerHTML=categoryOrder.map(key=>`<button class="category-btn${key===activeCategory?' active':''}" type="button" data-category="${key}">${esc(categoryLabels[key])}</button>`).join('')};
const getFiltered=()=>{const normalized=normalize(query);filtered=termsArray.filter(term=>(activeCategory==='all'||term.category===activeCategory)&&(!normalized||term.search.includes(normalized)))};
const card=term=>`<article class="card"><div class="card-content"><div class="card-top"><div class="icon-wrap" aria-hidden="true">${icons[term.icon]||'✨'}</div><h2>${esc(term.title)}</h2></div><p>${esc(term.desc)}</p><div class="card-footer"><span class="tag">${esc(categoryLabels[term.category])}</span><a href="${esc(term.link)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">مرجع رسمی <span aria-hidden="true">↗</span></a></div></div></article>`;
const render=append=>{const slice=filtered.slice(0,visibleCount);container.innerHTML=append?container.innerHTML+slice.slice(Math.max(0,visibleCount-pageSize)).map(card).join(''):slice.map(card).join('');stats.innerHTML=`تعداد نتایج: <strong>${filtered.length}</strong> از <strong>${termsArray.length}</strong>`;empty.classList.toggle('show',filtered.length===0);loadMoreWrap.hidden=filtered.length<=visibleCount};
const refresh=()=>{getFiltered();visibleCount=pageSize;render(false);status.textContent=query||activeCategory!=='all'?`فیلتر: ${categoryLabels[activeCategory]}${query?'، جستجو: '+query:''}`:''};
nav.addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;activeCategory=button.dataset.category;buildNav();refresh()});
search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(refresh,120)});
clear.addEventListener('click',()=>{search.value='';query='';activeCategory='all';buildNav();refresh();search.focus()});
loadMore.addEventListener('click',()=>{visibleCount+=pageSize;render(true);if(visibleCount>=filtered.length)loadMoreWrap.hidden=true});
document.addEventListener('mousemove',event=>{if(window.matchMedia('(pointer:coarse)').matches)return;if(raf)return;raf=requestAnimationFrame(()=>{document.documentElement.style.setProperty('--mx',`${event.clientX/window.innerWidth*100}%`);document.documentElement.style.setProperty('--my',`${event.clientY/window.innerHeight*100}%`);raf=0})},{passive:true});
search.addEventListener('input',()=>{query=search.value});
buildNav();refresh();
});
</script>
</body>

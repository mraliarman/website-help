name: Expand knowledge base
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  expand:
    if: github.event.head_commit.message != 'chore: expand knowledge base to 60000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand knowledge matrix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('term.js')
          s = p.read_text(encoding='utf-8')
          extra = [
              'راهکار عملی','الگوی پیاده‌سازی','وابستگی به محیط','Dev / Stage / Production','پیکربندی امن',
              'تحلیل Log','تحلیل علت ریشه‌ای','تصمیم‌گیری مهندسی','انتخاب جایگزین','مزایا','معایب','هزینه',
              'پیچیدگی','ریسک','اثر بر نگهداری','اثر بر توسعه‌پذیری','اثر بر تست‌پذیری','اثر بر مشاهده‌پذیری',
              'اثر بر شبکه','اثر بر پایگاه‌داده','اثر بر مرورگر','اثر بر موبایل','اثر بر Cache','اثر بر CDN',
              'امنیت هویت','مدیریت مجوزها','داده حساس','Core Web Vitals','Crawl Budget','Indexability',
              'Semantic HTML','UX','Internationalization','RTL و فارسی','Localization','API','Webhooks',
              'Queue و Cron','مرور نهایی'
          ]
          m = re.search(r'const facets=\[(.*?)\];', s, re.S)
          if not m:
              raise SystemExit('facets array not found')
          old = m.group(1)
          existing = re.findall(r'"((?:\\.|[^"\\])*)"', old)
          merged = existing + [x for x in extra if x not in existing]
          facets = 'const facets=[' + ','.join('"'+x.replace('"','\\"')+'"' for x in merged) + '];'
          s = s[:m.start()] + facets + s[m.end():]
          text_extra = {
              'راهکار عملی':'مراحل اجرایی قابل استفاده برای پیاده‌سازی این مفهوم در یک پروژه واقعی را مشخص می‌کند.',
              'الگوی پیاده‌سازی':'الگوهای رایج و قابل نگهداری برای پیاده‌سازی این مفهوم را معرفی می‌کند.',
              'وابستگی به محیط':'تفاوت رفتار و تنظیمات این مفهوم بین محیط‌های توسعه، آزمایشی و عملیاتی را بررسی می‌کند.',
              'Dev / Stage / Production':'نکات تفکیک تنظیمات و کنترل ریسک بین محیط‌های توسعه، Stage و Production را بیان می‌کند.',
              'پیکربندی امن':'تنظیمات امن پیشنهادی برای کاهش سطح حمله و خطای پیکربندی را ارائه می‌کند.',
              'تحلیل Log':'لاگ‌های مهم و روش خواندن آن‌ها برای تشخیص رفتار یا خطای این مفهوم را توضیح می‌دهد.',
              'تحلیل علت ریشه‌ای':'روش رسیدن از علامت مشکل به علت اصلی و جلوگیری از تکرار آن را بیان می‌کند.',
              'تصمیم‌گیری مهندسی':'معیارهای فنی برای انتخاب و استفاده از این مفهوم در یک تصمیم واقعی را ارائه می‌کند.',
              'انتخاب جایگزین':'گزینه‌های جایگزین و معیار مناسب برای انتخاب بین آن‌ها را مقایسه می‌کند.',
              'مزایا':'مزیت‌های فنی، عملیاتی و نگهداری این مفهوم را خلاصه می‌کند.',
              'معایب':'محدودیت‌ها، trade-offها و هزینه‌های پنهان استفاده از این مفهوم را بیان می‌کند.',
              'هزینه':'هزینه محاسباتی، زیرساختی، توسعه و نگهداری مرتبط با این مفهوم را بررسی می‌کند.',
              'پیچیدگی':'پیچیدگی زمانی، فضایی، معماری یا عملیاتی مرتبط را در حد کاربردی توضیح می‌دهد.',
              'ریسک':'ریسک‌های فنی و عملیاتی و روش کاهش آن‌ها را مشخص می‌کند.',
              'اثر بر نگهداری':'اثر انتخاب این مفهوم بر تعمیر، ارتقا، مستندسازی و پشتیبانی بلندمدت را بررسی می‌کند.',
              'اثر بر توسعه‌پذیری':'اثر این مفهوم بر افزودن قابلیت‌های آینده و تغییرات معماری را تحلیل می‌کند.',
              'اثر بر تست‌پذیری':'میزان سهولت تست و راهکارهای افزایش تست‌پذیری این مفهوم را توضیح می‌دهد.',
              'اثر بر مشاهده‌پذیری':'نکات مربوط به Metrics، Logs و Traces برای مشاهده‌پذیری این مفهوم را بیان می‌کند.',
              'اثر بر شبکه':'اثر بر latency، bandwidth، connection و الگوهای انتقال داده را بررسی می‌کند.',
              'اثر بر پایگاه‌داده':'اثر بر query، index، transaction و مصرف منابع پایگاه‌داده را بررسی می‌کند.',
              'اثر بر مرورگر':'رفتار و محدودیت‌های مرورگر و تفاوت‌های محیط client را مشخص می‌کند.',
              'اثر بر موبایل':'ملاحظات performance، UX و محدودیت منابع در دستگاه‌های موبایل را بیان می‌کند.',
              'اثر بر Cache':'نقش این مفهوم در cacheability، invalidation و cache hit ratio را بررسی می‌کند.',
              'اثر بر CDN':'نحوه استفاده از CDN و اثر آن بر latency، cache و توزیع محتوا را توضیح می‌دهد.',
              'امنیت هویت':'نکات مرتبط با authentication، session و هویت کاربر را بررسی می‌کند.',
              'مدیریت مجوزها':'اصل least privilege و کنترل دسترسی مناسب برای این مفهوم را توضیح می‌دهد.',
              'داده حساس':'نحوه حفاظت، حداقل‌سازی و جلوگیری از افشای داده‌های حساس مرتبط را مشخص می‌کند.',
              'Core Web Vitals':'اثر این مفهوم بر LCP، INP و CLS و تجربه واقعی کاربر را بررسی می‌کند.',
              'Crawl Budget':'ارتباط این مفهوم با مصرف منابع خزنده و مدیریت crawl را توضیح می‌دهد.',
              'Indexability':'موانع و کنترل‌های مؤثر بر قابل ایندکس بودن محتوا یا منابع را مشخص می‌کند.',
              'Semantic HTML':'نقش ساختار معنایی و عناصر استاندارد HTML در این مفهوم را توضیح می‌دهد.',
              'UX':'اثر این مفهوم بر تجربه کاربر، وضوح تعامل و کاهش اصطکاک را بررسی می‌کند.',
              'Internationalization':'ملاحظات چندزبانه، Unicode، locale و آماده‌سازی سیستم برای بازارهای مختلف را بیان می‌کند.',
              'RTL و فارسی':'ملاحظات راست‌به‌چپ، اعداد، فونت، تقویم و محتوای فارسی را بررسی می‌کند.',
              'Localization':'روش تطبیق محتوا، قالب‌بندی، ترجمه و تنظیمات محلی را توضیح می‌دهد.',
              'API':'نحوه ارتباط این مفهوم با API، قرارداد داده و versioning را بررسی می‌کند.',
              'Webhooks':'کاربرد event-driven و webhook برای اتصال این مفهوم به سرویس‌های دیگر را توضیح می‌دهد.',
              'Queue و Cron':'سناریوهای اجرای غیرهمزمان، صف و زمان‌بندی وظایف مرتبط را بررسی می‌کند.',
              'مرور نهایی':'مهم‌ترین نکات، ریسک‌ها و اقدام‌های لازم را برای استفاده حرفه‌ای جمع‌بندی می‌کند.'
          }
          marker = '};\nconst termsArray=[];'
          if marker not in s:
              raise SystemExit('facetText marker not found')
          additions = ''.join(',"'+k.replace('"','\\"')+'":"'+v.replace('"','\\"')+'"' for k,v in text_extra.items())
          s = s.replace(marker, additions+'};\nconst termsArray=[];', 1)
          s = s.replace('if(termsArray.length!==30000)throw new Error(`Knowledge base size mismatch: ${termsArray.length}`);', 'if(termsArray.length!==60000)throw new Error(`Knowledge base size mismatch: ${termsArray.length}`);')
          p.write_text(s, encoding='utf-8')
          r = Path('README.md')
          readme = r.read_text(encoding='utf-8')
          readme = readme.replace('۳۰٬۰۰۰ مدخل دانش', '۶۰٬۰۰۰ مدخل دانش')
          readme = readme.replace('۷۵۰ مفهوم پایه تخصصی** و **۴۰ بُعد آموزشی/مهندسی', '۷۵۰ مفهوم پایه تخصصی** و **۸۰ بُعد آموزشی/مهندسی')
          readme = readme.replace('دقیقاً **۳۰٬۰۰۰ مدخل قابل جستجو**', 'دقیقاً **۶۰٬۰۰۰ مدخل قابل جستجو**')
          readme = readme.replace('همزمان با ۳۰٬۰۰۰ کارت', 'همزمان با ۶۰٬۰۰۰ کارت')
          readme = readme.replace('assertion دقیق روی **۳۰٬۰۰۰**', 'assertion دقیق روی **۶۰٬۰۰۰**')
          readme = readme.replace('۳۰ حوزه تخصصی', '۳۰ حوزه تخصصی')
          r.write_text(readme, encoding='utf-8')
          Path('.github/workflows/expand-knowledge.yml').unlink()
          PY
      - name: Commit expanded knowledge base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add term.js README.md .github/workflows/expand-knowledge.yml
          git commit -m "chore: expand knowledge base to 60000"
          git push